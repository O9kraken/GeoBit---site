# Пуш в main → сборка Docker-образа в GitHub → публикация в GHCR → обновление сайта.
#
# Куда выкатывать, задаёт переменная репозитория DEPLOY_TARGET (Settings → Variables → Actions):
#   render (по умолчанию, на время разработки) — нужен секрет RENDER_DEPLOY_HOOK
#   vps    — свой сервер, нужны секреты SSH_HOST, SSH_USER, SSH_KEY (и SSH_PORT при нестандартном порте)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: latest
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_SERVER_URL=https://getgeobit.ru
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.latest.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    needs: build
    if: ${{ vars.DEPLOY_TARGET != 'vps' }}
    runs-on: ubuntu-latest
    steps:
      - name: Запустить деплой на Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Секрет RENDER_DEPLOY_HOOK не задан — образ собран, но Render не обновлён"; exit 0; fi
          curl -fsS -X POST "$HOOK&imgURL=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["IMAGE"], safe=""))')"

  vps:
    needs: build
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/geobit
            sed -i "s#^APP_IMAGE=.*#APP_IMAGE=${{ needs.build.outputs.image }}#" .env
            docker compose pull app
            docker compose up -d
            docker image prune -f
