# Render Blueprint (на время разработки). Образ собирает GitHub Actions, Render только запускает его.
# Перед применением замените OWNER/REPO на свой репозиторий (в нижнем регистре).
services:
  - type: web
    name: geobit
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/OWNER/REPO:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    healthCheckPath: /robots.txt
    envVars:
      - key: DATABASE_URI
        sync: false # строка подключения Neon (можно с -pooler)
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 # бесплатный тариф: 512 МБ памяти
      - key: MEDIA_STORAGE
        value: db # картинки в базе: диск Render стирается при каждом деплое
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
